[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projarvis"
version = "2.0.0"
description = "Project Jarvis v2.0 — Personal schedule CP-SAT optimization engine"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["projarvis*", "app*"]
